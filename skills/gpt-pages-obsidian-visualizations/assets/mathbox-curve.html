<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>正弦曲線振幅探索</title>
<style>
* { box-sizing: border-box; }
body { margin: 0; padding: 12px; color: #17243a; background: #fff; font: 15px system-ui, sans-serif; }
main { max-width: 760px; margin: auto; }
fieldset { display: flex; align-items: center; flex-wrap: wrap; gap: 10px; border: 0; padding: 0; margin: 12px 0; }
input { max-width: 100%; }
button { padding: 6px 12px; font: inherit; cursor: pointer; }
#chart { position: relative; height: 280px; width: 100%; overflow: hidden; }
#chart canvas { max-width: 100%; }
#status { overflow-wrap: anywhere; }
:focus-visible { outline: 3px solid #2563eb; outline-offset: 3px; }
</style>

.shadergraph-graph {
  font: 12px sans-serif;
  line-height: 25px;
  position: relative;
}
.shadergraph-graph:after {
  content: " ";
  display: block;
  height: 0;
  font-size: 0;
  clear: both;
}
.shadergraph-graph svg {
  pointer-events: none;
}
.shadergraph-clear {
  clear: both;
}
.shadergraph-graph svg {
  position: absolute;
  left: 0;
  right: 0;
  top: 0;
  bottom: 0;
  width: auto;
  height: auto;
}
.shadergraph-column {
  float: left;
}
.shadergraph-node .shadergraph-graph {
  float: left;
  clear: both;
  overflow: visible;
}
.shadergraph-node .shadergraph-graph .shadergraph-node {
  margin: 5px 15px 15px;
}
.shadergraph-node {
  margin: 5px 15px 25px;
  background: rgba(0, 0, 0, 0.1);
  border-radius: 5px;
  box-shadow: 0 1px 2px rgba(0, 0, 0, 0.2), 0 1px 10px rgba(0, 0, 0, 0.2);
  min-height: 35px;
  float: left;
  clear: left;
  position: relative;
}
.shadergraph-type {
  font-weight: bold;
}
.shadergraph-header {
  font-weight: bold;
  text-align: center;
  height: 25px;
  background: rgba(0, 0, 0, 0.3);
  text-shadow: 0 1px 2px rgba(0, 0, 0, 0.25);
  color: #fff;
  border-top-left-radius: 5px;
  border-top-right-radius: 5px;
  margin-bottom: 5px;
  padding: 0 10px;
}
.shadergraph-outlet div {
}
.shadergraph-outlet-in .shadergraph-name {
  margin-right: 7px;
}
.shadergraph-outlet-out .shadergraph-name {
  margin-left: 7px;
}

.shadergraph-name {
  margin: 0 4px;
}
.shadergraph-point {
  margin: 6px;
  width: 11px;
  height: 11px;
  border-radius: 7.5px;
  background: rgba(255, 255, 255, 1);
}
.shadergraph-outlet-in {
  float: left;
  clear: left;
}
.shadergraph-outlet-in div {
  float: left;
}
.shadergraph-outlet-out {
  float: right;
  clear: right;
}
.shadergraph-outlet-out div {
  float: right;
}

.shadergraph-node-callback {
  background: rgba(205, 209, 221, 0.5);
  box-shadow: 0 1px 2px rgba(0, 10, 40, 0.2), 0 1px 10px rgba(0, 10, 40, 0.2);
}
.shadergraph-node-callback > .shadergraph-header {
  background: rgba(0, 20, 80, 0.3);
}
.shadergraph-graph .shadergraph-graph .shadergraph-node-callback {
  background: rgba(0, 20, 80, 0.1);
}

.shadergraph-node-call {
  background: rgba(209, 221, 205, 0.5);
  box-shadow: 0 1px 2px rgba(10, 40, 0, 0.2), 0 1px 10px rgba(10, 40, 0, 0.2);
}
.shadergraph-node-call > .shadergraph-header {
  background: rgba(20, 80, 0, 0.3);
}
.shadergraph-graph .shadergraph-graph .shadergraph-node-call {
  background: rgba(20, 80, 0, 0.1);
}

.shadergraph-node-isolate {
  background: rgba(221, 205, 209, 0.5);
  box-shadow: 0 1px 2px rgba(40, 0, 10, 0.2), 0 1px 10px rgba(40, 0, 10, 0.2);
}
.shadergraph-node-isolate > .shadergraph-header {
  background: rgba(80, 0, 20, 0.3);
}
.shadergraph-graph .shadergraph-graph .shadergraph-node-isolate {
  background: rgba(80, 0, 20, 0.1);
}

.shadergraph-node.shadergraph-has-code {
  cursor: pointer;
}
.shadergraph-node.shadergraph-has-code::before {
  position: absolute;
  content: " ";
  top: 0;
  left: 0;
  right: 0;
  bottom: 0;
  display: none;
  border: 2px solid rgba(0, 0, 0, 0.25);
  border-radius: 5px;
}
.shadergraph-node.shadergraph-has-code:hover::before {
  display: block;
}
.shadergraph-code {
  z-index: 10000;
  display: none;
  position: absolute;
  background: #fff;
  color: #000;
  white-space: pre;
  padding: 10px;
  border-radius: 5px;
  box-shadow: 0 1px 2px rgba(0, 0, 0, 0.2), 0 1px 10px rgba(0, 0, 0, 0.2);
  font-family: monospace;
  font-size: 10px;
  line-height: 12px;
}

.shadergraph-overlay {
  position: fixed;
  top: 50%;
  left: 0;
  right: 0;
  bottom: 0;
  background: #fff;
  border-top: 1px solid #ccc;
}
.shadergraph-overlay .shadergraph-view {
  position: absolute;
  left: 0;
  top: 0;
  right: 0;
  bottom: 0;
  overflow: auto;
}
.shadergraph-overlay .shadergraph-inside {
  width: 4000px;
  min-height: 100%;
  box-sizing: border-box;
}
.shadergraph-overlay .shadergraph-close {
  position: absolute;
  top: 5px;
  right: 5px;
  padding: 4px;
  border-radius: 16px;
  background: rgba(255, 255, 255, 0.3);
  color: rgba(0, 0, 0, 0.3);
  cursor: pointer;
  font-size: 24px;
  line-height: 24px;
  width: 24px;
  text-align: center;
  vertical-align: middle;
}
.shadergraph-overlay .shadergraph-close:hover {
  background: rgba(255, 255, 255, 1);
  color: rgba(0, 0, 0, 1);
}
.shadergraph-overlay .shadergraph-graph {
  padding-top: 10px;
  overflow: visible;
  min-height: 100%;
}
.shadergraph-overlay span {
  display: block;
  padding: 5px 15px;
  margin: 0;
  background: rgba(0, 0, 0, 0.1);
  font-weight: bold;
  font-family: sans-serif;
}

.mathbox-loader {
  position: absolute;
  top: 50%;
  left: 50%;
  -webkit-transform: translate(-50%, -50%);
  transform: translate(-50%, -50%);
  padding: 10px;
  border-radius: 50%;
  background: #fff;
}

.mathbox-loader.mathbox-exit {
  opacity: 0;
  -webkit-transition: opacity 0.15s ease-in-out;
  transition: opacity 0.15s ease-in-out;
}

.mathbox-progress {
  height: 10px;
  border-radius: 5px;
  width: 80px;
  margin: 0 auto 20px;
  box-shadow: 1px 1px 1px rgba(255, 255, 255, 0.2),
    1px -1px 1px rgba(255, 255, 255, 0.2), -1px 1px 1px rgba(255, 255, 255, 0.2),
    -1px -1px 1px rgba(255, 255, 255, 0.2);
  background: #ccc;
  overflow: hidden;
}

.mathbox-progress > div {
  display: block;
  width: 0px;
  height: 10px;
  background: #888;
}

.mathbox-logo {
  position: relative;
  width: 140px;
  height: 100px;
  margin: 0 auto 10px;
  -webkit-perspective: 200px;
  perspective: 200px;
}

.mathbox-logo > div {
  position: absolute;
  left: 0;
  top: 0;
  bottom: 0;
  right: 0;
  -webkit-transform-style: preserve-3d;
  transform-style: preserve-3d;
}

.mathbox-logo > :nth-child(1) {
  -webkit-transform: rotateZ(22deg) rotateX(24deg) rotateY(30deg);
  transform: rotateZ(22deg) rotateX(24deg) rotateY(30deg);
}

.mathbox-logo > :nth-child(2) {
  -webkit-transform: rotateZ(11deg) rotateX(12deg) rotateY(15deg)
    scale3d(0.6, 0.6, 0.6);
  transform: rotateZ(11deg) rotateX(12deg) rotateY(15deg) scale3d(0.6, 0.6, 0.6);
}

.mathbox-logo > div > div {
  position: absolute;
  top: 50%;
  left: 50%;
  margin-left: -100px;
  margin-top: -100px;
  width: 200px;
  height: 200px;
  box-sizing: border-box;
  border-radius: 50%;
}

.mathbox-logo > div > :nth-child(1) {
  -webkit-transform: scale(0.5, 0.5);
  transform: rotateX(30deg) scale(0.5, 0.5);
}

.mathbox-logo > div > :nth-child(2) {
  -webkit-transform: rotateX(90deg) scale(0.42, 0.42);
  transform: rotateX(90deg) scale(0.42, 0.42);
}

.mathbox-logo > div > :nth-child(3) {
  -webkit-transform: rotateY(90deg) scale(0.35, 0.35);
  transform: rotateY(90deg) scale(0.35, 0.35);
}

.mathbox-logo > :nth-child(1) > :nth-child(1) {
  border: 16px solid #808080;
}
.mathbox-logo > :nth-child(1) > :nth-child(2) {
  border: 19px solid #a0a0a0;
}
.mathbox-logo > :nth-child(1) > :nth-child(3) {
  border: 23px solid #c0c0c0;
}
.mathbox-logo > :nth-child(2) > :nth-child(1) {
  border: 27px solid #808080;
}
.mathbox-logo > :nth-child(2) > :nth-child(2) {
  border: 32px solid #a0a0a0;
}
.mathbox-logo > :nth-child(2) > :nth-child(3) {
  border: 38px solid #c0c0c0;
}

.mathbox-splash-blue .mathbox-progress {
  background: #def;
}
.mathbox-splash-blue .mathbox-progress > div {
  background: #1979e7;
}
.mathbox-splash-blue .mathbox-logo > :nth-child(1) > :nth-child(1) {
  border-color: #1979e7;
}
.mathbox-splash-blue .mathbox-logo > :nth-child(1) > :nth-child(2) {
  border-color: #33b0ff;
}
.mathbox-splash-blue .mathbox-logo > :nth-child(1) > :nth-child(3) {
  border-color: #75eaff;
}
.mathbox-splash-blue .mathbox-logo > :nth-child(2) > :nth-child(1) {
  border-color: #18487f;
}
.mathbox-splash-blue .mathbox-logo > :nth-child(2) > :nth-child(2) {
  border-color: #33b0ff;
}
.mathbox-splash-blue .mathbox-logo > :nth-child(2) > :nth-child(3) {
  border-color: #75eaff;
}

.mathbox-overlays {
  position: absolute;
  left: 0;
  top: 0;
  right: 0;
  bottom: 0;
  pointer-events: none;
  transform-style: preserve-3d;
  overflow: hidden;
}
.mathbox-overlays > div {
  transform-style: preserve-3d;
}
.mathbox-overlay > div {
  position: absolute;
  will-change: transform, opacity;
}
.mathbox-label {
  font-family: sans-serif;
}
.mathbox-outline-1 {
  text-shadow: -1px -1px 0px rgb(255, 255, 255), 1px 1px 0px rgb(255, 255, 255),
    -1px 1px 0px rgb(255, 255, 255), 1px -1px 0px rgb(255, 255, 255),
    1px 0px 1px rgb(255, 255, 255), -1px 0px 1px rgb(255, 255, 255),
    0px -1px 1px rgb(255, 255, 255), 0px 1px 1px rgb(255, 255, 255);
}
.mathbox-outline-2 {
  text-shadow: 0px -2px 0px rgb(255, 255, 255), 0px 2px 0px rgb(255, 255, 255),
    -2px 0px 0px rgb(255, 255, 255), 2px 0px 0px rgb(255, 255, 255),
    -1px -2px 0px rgb(255, 255, 255), -2px -1px 0px rgb(255, 255, 255),
    -1px 2px 0px rgb(255, 255, 255), -2px 1px 0px rgb(255, 255, 255),
    1px 2px 0px rgb(255, 255, 255), 2px 1px 0px rgb(255, 255, 255),
    1px -2px 0px rgb(255, 255, 255), 2px -1px 0px rgb(255, 255, 255);
}
.mathbox-outline-3 {
  text-shadow: 3px 0px 0px rgb(255, 255, 255), -3px 0px 0px rgb(255, 255, 255),
    0px 3px 0px rgb(255, 255, 255), 0px -3px 0px rgb(255, 255, 255),
    -2px -2px 0px rgb(255, 255, 255), -2px 2px 0px rgb(255, 255, 255),
    2px 2px 0px rgb(255, 255, 255), 2px -2px 0px rgb(255, 255, 255),
    -1px -2px 1px rgb(255, 255, 255), -2px -1px 1px rgb(255, 255, 255),
    -1px 2px 1px rgb(255, 255, 255), -2px 1px 1px rgb(255, 255, 255),
    1px 2px 1px rgb(255, 255, 255), 2px 1px 1px rgb(255, 255, 255),
    1px -2px 1px rgb(255, 255, 255), 2px -1px 1px rgb(255, 255, 255);
}
.mathbox-outline-4 {
  text-shadow: 4px 0px 0px rgb(255, 255, 255), -4px 0px 0px rgb(255, 255, 255),
    0px 4px 0px rgb(255, 255, 255), 0px -4px 0px rgb(255, 255, 255),
    -3px -2px 0px rgb(255, 255, 255), -3px 2px 0px rgb(255, 255, 255),
    3px 2px 0px rgb(255, 255, 255), 3px -2px 0px rgb(255, 255, 255),
    -2px -3px 0px rgb(255, 255, 255), -2px 3px 0px rgb(255, 255, 255),
    2px 3px 0px rgb(255, 255, 255), 2px -3px 0px rgb(255, 255, 255),
    -1px -2px 1px rgb(255, 255, 255), -2px -1px 1px rgb(255, 255, 255),
    -1px 2px 1px rgb(255, 255, 255), -2px 1px 1px rgb(255, 255, 255),
    1px 2px 1px rgb(255, 255, 255), 2px 1px 1px rgb(255, 255, 255),
    1px -2px 1px rgb(255, 255, 255), 2px -1px 1px rgb(255, 255, 255);
}
.mathbox-outline-fill,
.mathbox-outline-fill * {
  color: #fff !important;
}
</style>
</head>
<body>
<main>
<p aria-label="函數公式">y = a·sin(2x)</p>
<p id="status" role="status">正在載入 MathBox 與相依套件…</p>
<fieldset id="controls" disabled>
<label for="amplitude">振幅 a</label>
<input id="amplitude" type="range" min="0" max="1.5" step="0.1" value="1">
<output id="value" for="amplitude">1.0</output>
<button id="reset" type="button">重設</button>
</fieldset>
<div id="chart" role="img" aria-label="可調整振幅的正弦曲線"></div>
</main>
<script>
(async function () {
  'use strict';
  const status = document.getElementById('status');
  const controls = document.getElementById('controls');
  const slider = document.getElementById('amplitude');
  const chart = document.getElementById('chart');
  function failed(error) {
    controls.disabled = true;
    status.setAttribute('role', 'alert');
    status.textContent = '圖表載入或更新失敗：' + String(error.message || error);
  }
  function loadOne(url, ready) {
    return new Promise(function (resolve, reject) {
      const element = document.createElement('script');
      let settled = false;
      function finish(error) {
        if (settled) return;
        settled = true;
        clearTimeout(timer);
        element.onload = null;
        element.onerror = null;
        if (error) { element.remove(); reject(error); }
        else resolve();
      }
      const timer = setTimeout(function () { finish(new Error('載入逾時：' + url)); }, 12000);
      element.src = url;
      element.crossOrigin = 'anonymous';
      element.onload = function () {
        try {
          if (!ready()) throw new Error('缺少必要 API：' + url);
          finish();
        } catch (error) { finish(error); }
      };
      element.onerror = function () { finish(new Error('載入失敗：' + url)); };
      document.head.appendChild(element);
    });
  }
  async function loadLibrary(label, urls, ready) {
    const failures = [];
    for (let i = 0; i < urls.length; i++) {
      status.textContent = '正在載入 ' + label + '（' + (i === 0 ? '主要來源' : '備援來源') + '）…';
      try { await loadOne(urls[i], ready); return; }
      catch (error) { failures.push(String(error.message || error)); }
    }
    throw new Error(label + ' 的主要與備援來源均無法載入。' + failures.join('；'));
  }
  try {
    await loadLibrary('Three.js', [
      'https://cdn.jsdelivr.net/npm/three@0.137.0/build/three.min.js',
      'https://unpkg.com/three@0.137.0/build/three.min.js'
    ], function () { return Boolean(window.THREE); });
    await loadLibrary('OrbitControls', [
      'https://cdn.jsdelivr.net/npm/three@0.137.0/examples/js/controls/OrbitControls.js',
      'https://unpkg.com/three@0.137.0/examples/js/controls/OrbitControls.js'
    ], function () { return typeof window.THREE.OrbitControls === 'function'; });
    await loadLibrary('MathBox', [
      'https://cdn.jsdelivr.net/npm/mathbox@2.3.1/build/bundle/mathbox.min.js',
      'https://unpkg.com/mathbox@2.3.1/build/bundle/mathbox.min.js'
    ], function () { return typeof window.MathBox?.mathBox === 'function'; });
    if (!window.THREE || !window.THREE.OrbitControls || !window.MathBox) throw new Error('MathBox 相依套件尚未初始化。');
    const box = window.MathBox.mathBox({ element: chart, plugins: ['core', 'controls', 'cursor'], controls: { klass: window.THREE.OrbitControls } });
    if (box.fallback || !box.three || !box.three.renderer) throw new Error('此顯示環境未能初始化 WebGL。');
    const host = box.three;
    host.renderer.setPixelRatio(1);
    function resize() {
      const width = Math.max(200, Math.floor(chart.getBoundingClientRect().width));
      host.renderer.setSize(width, 280);
      host.camera.aspect = width / 280;
      host.camera.updateProjectionMatrix();
    }
    resize();
    host.camera.position.set(0, 0, 4);
    host.camera.lookAt(0, 0, 0);
    host.renderer.setClearColor(0xf1f5f9, 1);
    const view = box.cartesian({ range: [[-2, 2], [-2, 2], [-1, 1]], scale: [1, 1, 1] });
    view.axis({ axis: 1, color: 0x64748b });
    view.axis({ axis: 2, color: 0x64748b });
    let amplitude = Number(slider.value);
    view.interval({ id: 'curve-data', width: 128, channels: 2, expr: function (emit, x) { emit(x, amplitude * Math.sin(2 * x)); } });
    view.line({ points: '#curve-data', color: 0x2563eb, width: 6 });
    function update() { amplitude = Number(slider.value); document.getElementById('value').textContent = amplitude.toFixed(1); }
    slider.addEventListener('input', update);
    document.getElementById('reset').addEventListener('click', function () { slider.value = '1'; update(); });
    window.addEventListener('resize', resize);
    controls.disabled = false;
    status.textContent = '拖動滑桿改變振幅；亦可拖動畫面旋轉視角。';
  } catch (error) { failed(error); }
})();
</script>
</body>
</html>
